[workspace]
members = ["deadmanssnitch", "mcp-deadmanssnitch", "deadmanssnitch-twin", "deadmanssnitch-conformance"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nateberkopec/mcp-deadmansnitch"
readme = "README.md"
keywords = ["deadmanssnitch", "monitoring", "mcp"]
categories = ["api-bindings", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.2.0", features = ["server", "macros", "transport-io", "schemars", "elicitation", "transport-streamable-http-server"] }
schemars = { version = "1.0", features = ["chrono04"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
